name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Andermc10
          outputs: |
            dist/github-snake.svg?color_snake=%2338BDF8&color_dots=%230B1220%230D1B2A%230E7490%230EA5E9%2338BDF8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
